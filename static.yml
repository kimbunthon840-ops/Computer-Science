# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Asset Compatibility (both root and subfolders)
        run: |
          mkdir -p css js img lib
          cp -n style.css responsive.css css/ 2>/dev/null || true
          cp -n main.js quiz.js js/ 2>/dev/null || true
          cp -n logo.png banner.jpg img/ 2>/dev/null || true
          cp -n icons.css lib/ 2>/dev/null || true
          cp -n css/* . 2>/dev/null || true
          cp -n js/* . 2>/dev/null || true
          cp -n img/* . 2>/dev/null || true
          cp -n lib/* . 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
